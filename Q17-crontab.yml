---
- name: Q17 Playbook to configure crontab
  hosts: all
  gather_facts: true
  become: true
  tasks:
    - name: Creating user if not exists
      ansible.builtin.user:
        name: student
        state: present
    - name: Configuring crontab
      ansible.builtin.cron:
        name: ex294_cron
        job: logger "EX294 in progress"
        minute: "*/2"
        user: student
