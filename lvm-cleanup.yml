---
- name: Advanced Resilient LVM and Partition Teardown
  hosts: "{{ HOSTS }}"
  gather_facts: true
  become: true
  tasks:
    - name: Storage Cleanup Execution Block
      block:
        # STEP 1: Aggressively target and unmount anything pinned to /dev/vdb1 or its LVs
        - name: Ensure any active mounts for vdb1 or research LVs are absent
          ansible.builtin.mount:
            path: "{{ item }}"
            state: absent
          loop:
            - "/dev/vdb1"
            - "/dev/research/research_lv"
            - "/dev/mapper/research-research_lv"
          failed_when: false

        # STEP 2: Force clean any underlying LVs mapped inside the Volume Group
        - name: Task-1 Removing Logical Volume (Forced)
          community.general.lvol:
            vg: research
            lv: research_lv
            state: absent
            force: true
          when: ansible_facts['lvm']['vgs']['research'] is defined

        # STEP 3: Deactivate the Volume Group to completely release kernel locks
        - name: Task-2 Deactivating research Volume Group
          ansible.builtin.command: /usr/sbin/vgchange -an research
          when: ansible_facts['lvm']['vgs']['research'] is defined
          failed_when: false
          changed_when: true

        # STEP 4: Force wipe the Volume Group container metadata
        - name: Task-3 Removing VolumeGroup (Forced)
          community.general.lvg:
            vg: research
            state: absent
            force: true
          when: ansible_facts['lvm']['vgs']['research'] is defined

        # STEP 5: Force close open file handles and drop device-mapper links
        - name: Task-4 Force close open device handles
          ansible.builtin.command: /usr/sbin/fuser -km /dev/vdb1
          failed_when: false
          changed_when: true

        - name: Task-5 Force remove device map links
          ansible.builtin.command: /usr/sbin/dmsetup remove /dev/mapper/research-research_lv
          failed_when: false
          changed_when: true

        # STEP 6: Break active kernel constraints and remove signatures
        - name: Task-6 Wiping partition signatures from block device
          ansible.builtin.command: /usr/sbin/wipefs -a /dev/vdb1
          when: ansible_facts['devices']['vdb']['partitions']['vdb1'] is defined
          failed_when: false
          changed_when: true

        # STEP 7: Attempt standard partition deletion
        - name: Task-7 Deleting Partition 1 from vdb
          community.general.parted:
            device: /dev/vdb
            number: 1
            state: absent
          when: ansible_facts['devices']['vdb']['partitions']['vdb1'] is defined

      rescue:
        # =====================================================================
        # RESCUE BLOCK: Safe fallback using pure native linux parting execution
        # =====================================================================
        - name: Rescue Phase - Force delete partition via raw parted script
          ansible.builtin.command: /usr/sbin/parted -s /dev/vdb rm 1
          failed_when: false
          changed_when: true

      always:
        # =====================================================================
        # ALWAYS BLOCK: Guarantees the system kernel re-reads the final disk map
        # =====================================================================
        - name: Always Phase - Force kernel partition table reload
          ansible.builtin.command: /usr/sbin/partprobe /dev/vdb
          failed_when: false
          changed_when: true

