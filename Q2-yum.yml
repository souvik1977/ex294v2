---
- name: Q2 - Configuring yum repo
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Installing gpg-key
      ansible.builtin.rpm_key:
        key: http://10.10.1.200/alma10/RPM-GPG-KEY-AlmaLinux-10
        state: present
    - name: Configuring Base Repo
      ansible.builtin.yum_repository:
        file: ex294_repo.repo
        state: present
        name: EX294_BASE
        description: EX294 base software
        baseurl:  http://10.10.1.200/alma10/BaseOS
        gpgcheck: true
        gpgkey: http://10.10.1.200/alma10/RPM-GPG-KEY-AlmaLinux-10
        enabled: true

    - name: Configuring AppStream Repo
      ansible.builtin.yum_repository:
        file: ex294_repo.repo
        state: present
        name: EX294_STREAM
        description: EX294 app software
        baseurl:  http://10.10.1.200/alma10/AppStream
        gpgcheck: true
        gpgkey: http://10.10.1.200/alma10/RPM-GPG-KEY-AlmaLinux-10
        enabled: true
